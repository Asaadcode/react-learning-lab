<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      body{
        font-family: Helvetica;
        margin-top: 0px;
        margin-bottom: 0px;
      }
      .send-button {
       background-color: rgb(25, 135, 84);
       border: none;
       color: white;
       padding: 12px 20px;
       margin-left: 10px;
       border-radius: 10px;
       font-size: 15px;
       cursor: pointer;
    }
    .chat-input{
      padding: 12px 15px;
      border-radius: 10px;
      border-width: 1px;
      font-size: 15px;
      flex-grow: 1;
    }
    .chat-input-container{
      display: flex;
      margin-bottom: 60px;
    }

    .app-container{
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .chat-message-user{
      display: flex;
      justify-content: end;
      align-items: start;
    }
    .chat-message-robot{
      display: flex;
      align-items: start;
    }

    .chat-message-text{
      background-color: rgb(238, 238, 238);
      font-family: Helvetica;
      padding: 15px 20px;
      border-radius: 10px;
      margin-right: 10px;
      margin-left: 10px;
      margin-bottom: 20px;
      max-width: 300px;
    }
    .chat-message-profile{
      width:45px;
    }
    .chat-messages-container{
      flex-grow: 1;
      margin-top: 20px;
      overflow: scroll;
      scrollbar-width: none;
    }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

    
      function useAutoScroll(dependencies) {
        const chatMessagesRef = React.useRef(null);

        React.useEffect(() => {
          const containerElem = chatMessagesRef.current;
          if (containerElem) {
            containerElem.scrollTop = containerElem.scrollHeight;
          }
        }, dependencies); 

        return chatMessagesRef;
      }

      function ChatInput({ chatMessages, setChatMessages }) {
        const [inputText, setInputText] = React.useState('');
        const [isLoading, setIsLoading] = React.useState(false);

        function saveInputText(event) {
          setInputText(event.target.value);
        }

        async function sendMessage() {
          if (isLoading) {
            return;
          }

          if (inputText === '') {
            return;
          }

          setInputText('');

          const newChatMessages = [
            ...chatMessages,
            {
              message: inputText,
              sender: 'user',
              id: crypto.randomUUID()
            }
          ];

          setChatMessages([
            ...newChatMessages,
            {
              message: (
                <img 
                  src="https://supersimple.dev/images/loading-spinner.gif" 
                  style={{ height: '40px', margin: '-15px' }} 
                />
              ),
              sender: 'robot',
              id: crypto.randomUUID()
            }
          ]);

          setIsLoading(true); 

          const response = await Chatbot.getResponseAsync(inputText);

          setIsLoading(false); 

          setChatMessages([
            ...newChatMessages,
            {
              message: response,
              sender: 'robot',
              id: crypto.randomUUID()
            }
          ]);
        }

        return (
          <div className='chat-input-container'>
            <input
              placeholder="Send a message to THINKAAD-demo"
              size="30"
              onChange={saveInputText}
              value={inputText}
              className='chat-input'
              onKeyDown={(event) => {
                if (event.key === 'Enter') {
                  sendMessage();
                }
                if (event.key === 'Escape') {
                  setInputText('');
                }
              }}
            />
            <button
              onClick={sendMessage}
              className='send-button'
            >Send</button>
          </div>
        );
      }
      
      function ChatMessage({ message, sender }) {
        return (
          <div className={
            sender === 'user' 
            ? 'chat-message-user' 
            : 'chat-message-robot'
          }>
            {sender === 'robot' && (
              <img src="robot.png" className='chat-message-profile' />
            )}
            <div className='chat-message-text'>
                {message}
            </div>
            {sender === 'user' && (
              <img src="user.png" width="50" className='chat-message-profile'/>
            )}
          </div>
        );
      }

      function ChatMessages({ chatMessages }) {
        const chatMessagesRef = useAutoScroll([chatMessages]);

        return (
          <div className='chat-messages-container' ref={chatMessagesRef}>
            
            {chatMessages.length === 0 && (
              <p style={{ textAlign: 'center', color: 'rgb(120, 120, 120)' }}>
                Welcome to the THINKAAD-demo! What's on your mind Today?
              </p>
            )}

            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                  key={chatMessage.id}
                />
              );
            })}
          </div>
        );
      }

      function App() {
        const [chatMessages, setChatMessages] = React.useState([]);

        return (
          <div className='app-container'>
            <ChatMessages
              chatMessages={chatMessages}
            />
            <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
            />
          </div>
        );
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
