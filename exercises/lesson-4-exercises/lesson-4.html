     function App() {
        // 1. Count state banayi jo 0 se start hogi
        const [count, setCount] = React.useState(0);

        // 2. useRef banaya jo button element ko yaad rakhega (remote control)
        const buttonRef = React.useRef(null);

        return (
          <div className="all-buttons">
            {/* 3. Main Counter Button jiske paas ref attached hai */}
            <button
              ref={buttonRef}
              onClick={() => setCount(count + 1)}
            >
              Clicked {count} times
            </button>

            {/* 4. Reset Button jo count ko wapas 0 kar dega */}
            <button onClick={() => setCount(0)}>
              Reset
            </button>

            {/* 5. Auto Click Button jo setInterval se har second click chalayega */}
            <button
              onClick={() => {
                setInterval(() => {
                  buttonRef.current.click();
                }, 1000);
              }}
            >
              Auto Click
            </button>
          </div>
        );
      }
