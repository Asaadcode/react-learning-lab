<!DOCTYPE html>
<html>
  <head>
    <title>Lesson 4 Exercises</title>
    <style>

.button-on{
    background-color: rgb(25, 135, 84);
    color: white;
    border: none;
    margin-left: 10px;
    margin-top: 10px;
    border-radius: 10px;
    width: 100px;
    height: 40px;
    font-size: 16px;
    cursor: pointer;

}
.button-off{
    background-color: rgb(179, 89, 5);
    color: white;
     border: none;
    margin-left: 10px;
    margin-top: 10px;
    border-radius: 10px;
      width: 100px;
    height: 40px;
    font-size: 16px;
    cursor: pointer;

}


    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
     function App() {
  const [isButtonOn, setIsButtonOn] = React.useState(true);

  function handleClick() {
    setIsButtonOn(!isButtonOn);
  }

  return (
    <div>
      <button onClick={handleClick} className={isButtonOn ? 'button-on' : 'button-off'}>{isButtonOn ? 'ON' : 'OFF'}</button>
      

    </div>
  );
}


      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
